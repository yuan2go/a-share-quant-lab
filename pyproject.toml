[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-quant-lab"
version = "0.2.0"
description = "A-share Qlib research with DuckDB raw-data history and Parquet snapshots"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "yuan2go" }]
dependencies = []

[project.optional-dependencies]
# Research data owner and native Parquet projection
storage = ["duckdb>=1.2,<2", "pytz>=2024.1"]
# Full local study environment: Qlib's dump_bin.py uses pandas.read_parquet
qlib = ["duckdb>=1.2,<2", "pytz>=2024.1", "pyqlib==0.9.7", "pyarrow>=14,<30", "fire>=0.5"]

[project.scripts]
aql = "ashare_quant_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
