# Manual only: requires a repository secret named TUSHARE_TOKEN.
name: A-share first real-data research (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_HTTP_URL: https://t.xiaodefa.top/
    steps:
      - name: Checkout experiment implementation
        uses: actions/checkout@v4
      - name: Python research environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source credentials without printing them
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "::error::Repository Actions secret TUSHARE_TOKEN is missing; no market data fetched."
            exit 1
          fi
      - name: Install Qlib and export dependencies
        run: python -m pip install -e '.[qlib]' fire
      - name: Check live trade-calendar permission
        run: aql check-source --start 20260101 --end 20261116
      - name: Export fixed-cohort retrospective research snapshot
        run: |
          aql export-qlib-csv \
            --symbols-file configs/first-study-cohort.txt \
            --start 2019-01-02 --end 2026-10-30 \
            --output-dir data/first-study-csv \
            --pace-seconds 2
      - name: Fetch matching official Qlib CSV converter
        run: git clone --depth 1 --branch v0.9.7 https://github.com/microsoft/qlib.git "$RUNNER_TEMP/qlib-src"
      - name: Convert CSV to Qlib format
        run: |
          aql dump-qlib \
            --qlib-repo "$RUNNER_TEMP/qlib-src" \
            --csv-dir data/first-study-csv \
            --provider-uri data/first-study-qlib
      - name: Execute LightGBM versus momentum ranking study
        run: |
          aql run-first-study \
            --provider-uri data/first-study-qlib \
            --manifest data/first-study-csv/manifest.json \
            --config configs/first-study.json \
            --output-dir outputs/first-study
      - name: Validate model output shape
        run: aql validate-artifact outputs/first-study/prediction-batch.json
      - name: Upload research summary only; no paid market bars
        uses: actions/upload-artifact@v4
        with:
          name: aql-first-study-report
          path: |
            outputs/first-study/prediction-batch.json
            outputs/first-study/study-report.json
          if-no-files-found: error
          retention-days: 7
