# Manual research only; no purchase, brokerage, or scheduled background task.
# In this public repository, market-data API credentials belong in Actions Secrets.
name: A-share first real-data research (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_HTTP_URL: https://t.xiaodefa.top/
    steps:
      - name: Checkout research implementation
        uses: actions/checkout@v4
      - name: Python Qlib and DuckDB environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require data-provider credentials (no token output)
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "::error::TUSHARE_TOKEN Actions secret missing; no provider request started."
            exit 1
          fi
      - name: Install Qlib plus DuckDB and Parquet converter dependencies
        run: python -m pip install -e '.[qlib]'
      - name: Probe actual Tushare exchange calendar
        run: aql check-source --start 20260101 --end 20261116
      - name: Capture real source data in local DuckDB (not published)
        run: |
          aql ingest-market \
            --db-path data/market.duckdb \
            --symbols-file configs/first-study-cohort.txt \
            --start 2019-01-02 --end 2026-10-30 \
            --pace-seconds 2
          aql market-status --db-path data/market.duckdb
      - name: Export immutable Parquet dataset for Qlib
        run: |
          aql export-qlib-parquet \
            --db-path data/market.duckdb \
            --symbols-file configs/first-study-cohort.txt \
            --start 2019-01-02 --end 2026-10-30 \
            --output-dir data/first-study-parquet
      - name: Fetch official Qlib converter matching installed version
        run: git clone --depth 1 --branch v0.9.7 https://github.com/microsoft/qlib.git "$RUNNER_TEMP/qlib-src"
      - name: Convert verified Parquet to Qlib binary
        run: |
          aql dump-qlib \
            --qlib-repo "$RUNNER_TEMP/qlib-src" \
            --snapshot-dir data/first-study-parquet \
            --provider-uri data/first-study-qlib
      - name: Run retrospective LightGBM versus momentum RankIC study
        run: |
          aql run-first-study \
            --provider-uri data/first-study-qlib \
            --manifest data/first-study-parquet/manifest.json \
            --config configs/first-study.json \
            --output-dir outputs/first-study
      - name: Validate produced ranking artifact
        run: aql validate-artifact outputs/first-study/prediction-batch.json
      - name: Preserve only derived research outputs (not licensed raw bars)
        uses: actions/upload-artifact@v4
        with:
          name: aql-first-study-report
          path: |
            outputs/first-study/prediction-batch.json
            outputs/first-study/study-report.json
          retention-days: 7
          if-no-files-found: error
