name: Python research adapters and local DuckDB/Parquet verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core plus native DuckDB (no paid data or Qlib training)
        run: python -m pip install -e '.[storage]'
      - name: Verify local database, Parquet, contracts and CLI
        run: python -m unittest discover -s tests -v
      - name: Check research CLI
        run: aql status
      - name: Compile Python source
        run: python -m compileall -q src scripts
      - name: Package external TSP page
        run: python scripts/package_tsp_extension.py
      - name: Verify JavaScript extension syntax
        run: node --check integrations/tsp/frontend/extension.mjs
  native-qlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Qlib and compatible recorder
        run: python -m pip install -e '.[qlib]'
      - name: Check paired denominator and named index regressions
        run: python -m unittest discover -s tests -p test_research_evaluation.py -v
      - name: Fetch matching official converter
        run: git clone --depth 1 --branch v0.9.7 https://github.com/microsoft/qlib.git "$RUNNER_TEMP/qlib-source"
      - name: Synthetic native end-to-end (no credentials, no real research claim)
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python scripts/native_qlib_smoke.py --root "$RUNNER_TEMP/aql-synthetic" --qlib-repo "$RUNNER_TEMP/qlib-source"
