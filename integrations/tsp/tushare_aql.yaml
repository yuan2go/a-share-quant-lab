# Local completed-capture DuckDB gateway for TSP stock historical data.
# Copy to your TSP data/data_sources/ and reload; no Tushare token here.
# Docker TSP requires a properly firewalled host bridge/private network.
# Only A-share daily bars and adjustment events; no realtime/ETF/financial.
name: tushare_aql
display_name: "AQL DuckDB Historical A-Shares"
auth:
  type: none
datasets:
  daily:
    url: http://127.0.0.1:8765/daily
    method: POST
    batch: 5
    rpm: 60
    timeout: 120
    response_path: data
    field_map:
      ts_code: symbol
      trade_date: date
      open: open
      high: high
      low: low
      close: close
      vol: volume
      amt: amount
    transforms:
      date: "parse_date(value, '%Y-%m-%d')"
  adj_factor:
    url: http://127.0.0.1:8765/adj_factor
    method: POST
    batch: 5
    rpm: 60
    timeout: 120
    response_path: data
    field_map:
      ts_code: symbol
      trade_date: trade_date
      factor: ex_factor
    transforms:
      trade_date: "parse_date(value, '%Y-%m-%d')"
